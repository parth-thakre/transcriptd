plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace = "dev.transcriptd.app"
    compileSdk = 36
    defaultConfig {
        applicationId "dev.transcriptd.app"
        // Android 13: the accessibility input connection (commitText at the caret) needs API 33.
        minSdk 33
        targetSdk 36
        versionCode 7
        versionName "0.1.6"
        // Optional: bake your server in (./gradlew assembleDebug -PtranscriptdServer=http://100.x.y.z:7411,
        // your server's Tailscale IP). Empty by default: the app starts unpaired.
        // With tailnet_auth on the server, the app then needs no pairing at all.
        buildConfigField "String", "DEFAULT_SERVER", "\"${project.findProperty('transcriptdServer') ?: ''}\""
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    buildFeatures { buildConfig = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
}
