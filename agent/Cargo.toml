[package]
name = "transcriptd-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"  # std::fs::File::try_lock (ipc.rs)
license = "MIT"
description = "transcriptd sidecar: global push-to-talk, audio capture, text injection"

[[bin]]
name = "transcriptd-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# TLS for https:// servers (wss:// and the HTTP uploads): rustls with the ring provider
# and the OS trust store, so no system OpenSSL on Linux or Windows.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arboard = { version = "3", features = ["wayland-data-control"] }
hound = "3"
directories = "6"
crossbeam-channel = "0.5"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
atspi = { version = "0.30", default-features = false, features = ["connection", "proxies", "zbus", "tokio"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.18"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_UI_Accessibility",
] }

[profile.release]
lto = "thin"
strip = true
