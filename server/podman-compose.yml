services:
  cpu:
    build:
      context: .
      dockerfile: Containerfile.cpu
    ports:
      - "127.0.0.1:7411:7411"
    volumes:
      - ./data:/data:Z
      - ./models:/models:Z
      # - ./config.toml:/app/config.toml:ro,Z
    restart: unless-stopped

