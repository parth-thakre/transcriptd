[project]
name = "transcriptd-server"
version = "0.1.0"
description = "Self-hosted dictation and meeting transcription server with a faithfulness guard"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=13",
  "sqlmodel>=0.0.22",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "numpy>=1.26",
  "soundfile>=0.12",
  "onnxruntime>=1.19",
  "rapidfuzz>=3.9",
  "jellyfish>=1.1",
  "indic-transliteration>=2.3",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "huggingface-hub>=0.24",
  "transcribe-cpp>=0.2.4",
  "soxr>=1.1.0",
]

[project.optional-dependencies]
# HF transformers engine (Indic-Transcribe-Flex, Whisper fine-tunes) and diarization
# need torch. Pick exactly one torch extra for your GPU:
#   uv sync --extra hf --extra torch-rocm     (AMD, ROCm 7.1 wheels)
#   uv sync --extra hf --extra torch-cuda     (NVIDIA, CUDA 12.8 wheels)
#   uv sync --extra hf --extra torch-cpu
hf = ["transformers>=4.45", "accelerate>=0.33", "torch>=2.6", "torchaudio>=2.6"]
diarize = ["pyannote.audio>=3.3", "torch>=2.6", "torchaudio>=2.6"]
indic = ["ai4bharat-transliteration>=1.1"]
torch-rocm = ["torch>=2.6", "torchaudio>=2.6", "triton-rocm; sys_platform == 'linux'"]
torch-cuda = ["torch>=2.6", "torchaudio>=2.6"]
torch-cpu = ["torch>=2.6", "torchaudio>=2.6"]

[tool.uv]
conflicts = [[{ extra = "torch-rocm" }, { extra = "torch-cuda" }, { extra = "torch-cpu" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-rocm", extra = "torch-rocm" },
  { index = "pytorch-cuda", extra = "torch-cuda" },
  { index = "pytorch-cpu", extra = "torch-cpu" },
]
torchaudio = [
  { index = "pytorch-rocm", extra = "torch-rocm" },
  { index = "pytorch-cuda", extra = "torch-cuda" },
  { index = "pytorch-cpu", extra = "torch-cpu" },
]
# ROCm torch pulls its triton build from the same index (name varies by release).
triton-rocm = { index = "pytorch-rocm", extra = "torch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.1"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
transcriptd = "transcriptd.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transcriptd"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
